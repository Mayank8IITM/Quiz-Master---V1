{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col">
            <h2>Manage Chapters</h2>
        </div>
        <div class="col text-end">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addChapterModal">
                Add Chapter
            </button>
        </div>
    </div>

    <div class="row">
        {% for chapter in chapters %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ chapter.name }}</h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ chapter.subject.name }}</h6>
                    <p class="card-text">{{ chapter.description }}</p>
                    <div class="mt-auto">
                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#editChapterModal{{ chapter.id }}">Edit</button>
                        <a href="{{ url_for('delete_chapter', chapter_id=chapter.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this chapter?')">Delete</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Add Chapter Modal -->
<div class="modal fade" id="addChapterModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Chapter</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="POST">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="subject_id" class="form-label">Subject</label>
                        <select class="form-select" id="subject_id" name="subject_id" required>
                            <option value="">Select Subject</option>
                            {% for subject in subjects %}
                            <option value="{{ subject.id }}">{{ subject.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Chapter Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Add Chapter</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Chapter Modals -->
{% for chapter in chapters %}
<div class="modal fade" id="editChapterModal{{ chapter.id }}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Chapter</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="POST" action="{{ url_for('edit_chapter', chapter_id=chapter.id) }}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="subject_id{{ chapter.id }}" class="form-label">Subject</label>
                        <select class="form-select" id="subject_id{{ chapter.id }}" name="subject_id" required>
                            {% for subject in subjects %}
                            <option value="{{ subject.id }}" {% if subject.id == chapter.subject_id %}selected{% endif %}>
                                {{ subject.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="name{{ chapter.id }}" class="form-label">Chapter Name</label>
                        <input type="text" class="form-control" id="name{{ chapter.id }}" name="name" value="{{ chapter.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description{{ chapter.id }}" class="form-label">Description</label>
                        <textarea class="form-control" id="description{{ chapter.id }}" name="description" rows="3">{{ chapter.description }}</textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
