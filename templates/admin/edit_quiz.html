{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">Edit Quiz</h2>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label">Quiz Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ quiz.title }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="chapter_id" class="form-label">Chapter</label>
                            <select class="form-select" id="chapter_id" name="chapter_id" required>
                                {% for chapter in chapters %}
                                <option value="{{ chapter.id }}" {% if chapter.id == quiz.chapter_id %}selected{% endif %}>
                                    {{ chapter.subject.name }} - {{ chapter.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="date_of_quiz" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date_of_quiz" name="date_of_quiz" 
                                value="{{ quiz.start_date.strftime('%Y-%m-%d %H:%M') }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="time_of_quiz" class="form-label">Time</label>
                            <input type="time" class="form-control" id="time_of_quiz" name="time_of_quiz" 
                                value="{{ quiz.start_date.strftime('%Y-%m-%d %H:%M') }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="duration" class="form-label">Duration (minutes)</label>
                            <input type="number" class="form-control" id="duration" name="duration" 
                                value="{{ quiz.duration }}" required min="1">
                        </div>
                        <div class="mb-3">
                            <label for="remarks" class="form-label">Remarks</label>
                            <textarea class="form-control" id="remarks" name="remarks" rows="3">{{ quiz.remarks }}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('manage_quizzes') }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
